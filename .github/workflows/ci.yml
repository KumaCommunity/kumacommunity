name: CI

# Validation only. Production deploys are handled separately by the Cloudflare
# Workers Builds Git integration; this workflow has no deployment credentials.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded pull request runs. Every push to main runs to completion so
# each deployed commit has a validation result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    # Same Node.js version as .nvmrc, local development and Cloudflare builds.
    name: Site (Node from .nvmrc) - typecheck, build, browser tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use npm version from package.json packageManager
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Production build (fails on broken links)
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Playwright tests (unit and browser)
        run: npx playwright test

      # Builds an isolated copy with test-only docs and blog posts. Covers
      # populated blog rendering and content-license exceptions.
      - name: Licensing fixture tests (isolated site)
        if: ${{ !cancelled() }}
        run: npm run test:licensing

      - name: Write Playwright job summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-test-summary.mjs playwright-report

      - name: Upload Playwright reports, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  node-compat:
    # Browser tests exercise static HTML, which does not depend on the Node.js
    # version. Node-dependent work (install, typecheck, static generation and
    # Node-only specs) is repeated here for the other supported release line.
    name: Node ${{ matrix.node }} compatibility - typecheck, build, unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use npm version from package.json packageManager
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Production build (fails on broken links)
        run: npm run build

      - name: Playwright unit tests (no browser)
        run: npx playwright test --project=unit

      - name: Write Playwright job summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-test-summary.mjs playwright-report

  audit:
    name: Dependency audit (fails on critical)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use npm version from package.json packageManager
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies from lockfile (no install scripts)
        run: npm ci --ignore-scripts

      - name: npm audit (fails on critical)
        run: npm run audit

      # Reports every severity for all and production-only dependencies.
      # Informational: only critical findings fail the job.
      - name: Summarize audit findings by severity
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-production.json || true
          node -e '
            const fs = require("fs");
            const rows = [["All dependencies", "audit-all.json"], ["Production (--omit=dev)", "audit-production.json"]];
            const lines = ["## npm audit", "", "| Scope | Critical | High | Moderate | Low |", "| --- | ---: | ---: | ---: | ---: |"];
            for (const [scope, file] of rows) {
              const v = JSON.parse(fs.readFileSync(file, "utf8")).metadata?.vulnerabilities ?? {};
              lines.push(`| ${scope} | ${v.critical ?? "?"} | ${v.high ?? "?"} | ${v.moderate ?? "?"} | ${v.low ?? "?"} |`);
            }
            lines.push("", "Only critical findings fail this job. Run `npm audit` locally for package details.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
