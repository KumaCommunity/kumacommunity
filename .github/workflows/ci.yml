name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, and smoke tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use supported npm version
        run: npm install --global npm@12.2.3

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Production build (fails on broken links)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-node-${{ matrix.node }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit (critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use supported npm version
        run: npm install --global npm@12.2.3

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: npm audit (fails on critical)
        run: npm run audit
